# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Rebuilds daily at 08:00 UTC to publish scheduled posts (future-dated, draft: false)
  schedule:
    - cron: '0 8 * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.162.0
      # Pinned deliberately. A bare `snap install dart-sass` floats to whatever
      # snap ships that day, and Hugo does not fail when the transpiler changes
      # or goes missing — it silently emits different CSS. See pa-lq75.
      DART_SASS_VERSION: 1.100.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Install Dart Sass
        run: |
          wget -O ${{ runner.temp }}/dart-sass.tar.gz https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz \
          && tar -xf ${{ runner.temp }}/dart-sass.tar.gz -C ${{ runner.temp }} \
          && echo "${{ runner.temp }}/dart-sass" >> "$GITHUB_PATH"
      # Hugo falls back to LibSass and exits 0 when Dart Sass is unreachable,
      # producing a subtly wrong stylesheet. `hugo env` prints a
      # dart-sass/implementation line only when it is genuinely reachable, so
      # this is the one check that distinguishes a good build from a silent
      # downgrade. Fail here rather than deploying wrong CSS.
      - name: Verify toolchain
        run: |
          hugo env
          hugo env | grep -q "dart-sass/implementation=\"${DART_SASS_VERSION}\"" || {
            echo "ERROR: Hugo cannot reach Dart Sass ${DART_SASS_VERSION}."
            echo "It would fall back to LibSass and emit different CSS with exit 0."
            exit 1
          }
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
